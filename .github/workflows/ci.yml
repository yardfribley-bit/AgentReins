name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and package Universal 2 app
    runs-on: macos-15
    timeout-minutes: 25
    env:
      # Smoke steps run packaged Python from inside AgentReins.app (the socket sampler
      # imports Contents/Resources/agentreins-mcp/evidence.py; install_mcp_http.py lives
      # in that directory). CPython then writes __pycache__/*.cpython-*.pyc into the
      # bundle. Those files are not covered by the code signature, so
      # `codesign --verify --deep --strict` fails on the downloaded zip.
      # Setting this only on individual steps was not enough (the live sampler step
      # still imported from the bundle). Every step in this job must refuse bytecode.
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Show toolchain
        run: swift --version

      - name: Validate packaging script
        run: bash -n package_app.sh

      - name: Dedicated unlocked CI keychain (integrity key never waits for a prompt)
        run: scripts/ci_keychain.sh setup

      - name: Shared redaction vectors (Python)
        run: |
          set -euo pipefail
          python3 tools/redact_secrets.py
          # Playbook self-check line: REDACT leaks=0 over=0 total=N

      - name: Run unit tests
        run: |
          set -euo pipefail
          # Keep WebKit UI test in its own process so a WebContent SIGSEGV cannot
          # take down the rest of the suite (seen on macos-15 runners).
          swift test --skip testProductionWebKitRendersAndEscapesEvidence
          for attempt in 1 2 3; do
            if swift test --filter testProductionWebKitRendersAndEscapesEvidence; then
              exit 0
            fi
            echo "WebKit UI test failed (attempt ${attempt}); retrying"
            sleep 2
          done
          exit 1

      - name: Run JS risk / XSS tests
        run: |
          set -euo pipefail
          node Tests/Manual/network/test_risk_p5_association.cjs
          node Tests/Manual/network/test_risk_review_store.cjs
          node Tests/Manual/network/test_xss_escape.cjs
          ESC_MUTANT_MIN_KILL=84 node tools/mutate_esc_calls.cjs
          node Tests/Manual/network/test_socket_ledger_view.cjs
          node Tests/Manual/network/test_xss_network_views.cjs
          ESC_MUTANT_MIN_KILL=33 node tools/mutate_esc_calls.cjs Sources/AgentReins/Resources/RealtimeWorkspace/network-view.js Tests/Manual/network/test_xss_network_views.cjs
          node Tests/Manual/network/test_phase2_views.cjs
          echo "JS_TESTS_PASSED=6"

      - name: Run MCP supervisor unit tests (incl. Python <-> Swift MCP core parity)
        env:
          # test_swift_parity.py builds Sources/AgentReinsCore/Core*.swift with swiftc; never skip it in CI.
          AGENTREINS_REQUIRE_SWIFT_PARITY: "1"
        run: |
          python3 -m unittest discover -s tools/agentreins-mcp -p 'test_*.py' -v

      - name: Socket sampler unit tests (recorded lsof/ps fixtures)
        run: |
          python3 -m unittest discover -s tools/socket-sampler -p 'test_*.py' -v

      # LaunchAgent runs the sampler with macOS /usr/bin/python3 (3.9.6). `X | Y` in a
      # runtime alias is a TypeError there even with `from __future__ import annotations`.
      # GitHub's `python3` on this image is newer, so the step above does not catch it.
      - name: Socket sampler unit tests (system Python 3.9)
        run: |
          set -euo pipefail
          py=/usr/bin/python3
          "$py" -c 'import sys; print(sys.version); raise SystemExit(0 if sys.version_info[:2] == (3, 9) else 1)'
          "$py" -c 'import sys; sys.path[:0] = ["tools/socket-sampler", "tools/agentreins-mcp"]; import proc_lookup, socket_sampler'
          "$py" -m unittest discover -s tools/socket-sampler -p 'test_*.py' -v

      - name: Live socket sampling (macOS, direct connection, proxy env unset)
        run: |
          set -euo pipefail
          env -u HTTP_PROXY -u HTTPS_PROXY -u ALL_PROXY -u http_proxy -u https_proxy -u all_proxy \
            python3 tools/socket-sampler/live_direct_check.py

      - name: Build release app
        env:
          AGENTREINS_ARCHS: universal
          AGENTREINS_VERSION: 1.1.0
          AGENTREINS_BUILD_NUMBER: ${{ github.run_number }}
        run: ./package_app.sh

      - name: Verify architectures, signature, packaged MCP, no snapshot hooks
        run: |
          set -euo pipefail
          lipo -archs AgentReins.app/Contents/MacOS/AgentReins | grep arm64
          lipo -archs AgentReins.app/Contents/MacOS/AgentReins | grep x86_64
          codesign --verify --deep --strict --verbose=2 AgentReins.app
          test -f AgentReins.app/Contents/Resources/agentreins-mcp/server.py
          test -f AgentReins.app/Contents/Resources/agentreins-mcp/evidence.py
          test -f AgentReins.app/Contents/Resources/agentreins-mcp/alerts_bridge.cjs
          test -f AgentReins.app/Contents/Resources/agentreins-mcp/redact_secrets.py
          test -f AgentReins.app/Contents/Resources/agentreins-mcp/redact_vectors.json
          test -f AgentReins.app/Contents/Resources/RealtimeWorkspace/risk-alerts.js
          test -x AgentReins.app/Contents/MacOS/AgentReinsMCP
          test -f AgentReins.app/Contents/Resources/socket-sampler/socket_sampler.py
          test -f AgentReins.app/Contents/Resources/socket-sampler/install_socket_sampler.py
          test -f AgentReins.app/Contents/Resources/agentreins-mcp/install_mcp_http.py
          test -x AgentReins.app/Contents/MacOS/AgentReinsAlertsBridge
          test -x AgentReins.app/Contents/MacOS/AgentReinsKeychainHelper
          for exe in AgentReinsMCP AgentReinsAlertsBridge AgentReinsKeychainHelper; do
            lipo -archs "AgentReins.app/Contents/MacOS/$exe" | grep arm64
            lipo -archs "AgentReins.app/Contents/MacOS/$exe" | grep x86_64  # Intel Macs (WorkBuddy's) run this slice
          done
          ! git grep -n 'snapshot-alerts' -- . ':!.github' ':!*.md'
          ! git grep -n 'snapshot_risk_alerts' -- . ':!.github' ':!*.md'
          # Test switches must not ship (tests inject fakes from test-only code instead).
          # (`! cmd` does not trip `set -e`, so these use explicit exits.)
          if git grep -n -e 'AGENTREINS_REDACT_SELFTEST' -e 'AGENTREINS_KEYCHAIN_BACKEND' -e '_MEMORY_KEYCHAIN' -- Sources tools/agentreins-mcp/evidence.py tools/agentreins-mcp/server.py tools/socket-sampler/socket_sampler.py; then exit 1; fi
          if git grep -n -e 'set esc' -- Sources/AgentReins/Resources/RealtimeWorkspace; then exit 1; fi
          if strings AgentReins.app/Contents/MacOS/AgentReinsMCP | grep -e AGENTREINS_REDACT_SELFTEST -e AGENTREINS_KEYCHAIN_BACKEND; then exit 1; fi
          if grep -rn -e AGENTREINS_KEYCHAIN_BACKEND -e _MEMORY_KEYCHAIN AgentReins.app/Contents/Resources/agentreins-mcp; then exit 1; fi
          echo "PACKAGED_MCP_OK=1"

      - name: Create CI artifact from the pristine signed bundle
        # package_app.sh has already codesigned AgentReins.app. Zip that bundle now,
        # before any smoke step executes Python from inside it. Do not edit the
        # bundle after signing: deleting __pycache__ would invalidate the signature.
        run: |
          set -euo pipefail
          bytecode="$(find AgentReins.app \( -name '__pycache__' -o -name '*.pyc' \) -print)"
          if codesign -dv AgentReins.app >/dev/null 2>&1; then
            if [[ -n "$bytecode" ]]; then
              echo "error: signed bundle already contains Python bytecode; refusing to modify it after codesign" >&2
              printf '%s\n' "$bytecode" >&2
              exit 1
            fi
            echo "Signed bundle has no __pycache__ or .pyc; zipping it unchanged"
          else
            # Only reachable if this step is ever moved to before codesign.
            echo "Bundle is not signed yet; removing __pycache__ and *.pyc before the zip"
            while IFS= read -r cache_dir; do
              echo "removing $cache_dir"
              rm -rf "$cache_dir"
            done < <(find AgentReins.app -type d -name '__pycache__')
            while IFS= read -r pyc; do
              echo "removing $pyc"
              rm -f "$pyc"
            done < <(find AgentReins.app -type f -name '*.pyc')
          fi
          ditto -c -k --sequesterRsrc --keepParent AgentReins.app AgentReins-ci-universal.zip

      - name: Fresh CI keychain for the packaged helper
        # Items created above by the dev-built helper only trust that binary; the packaged
        # AgentReinsKeychainHelper must create (and own) the integrity key itself.
        run: scripts/ci_keychain.sh reset

      - name: Packaged MCP smoke
        # Redaction vectors run against the same AgentReinsCore sources in test_swift_parity.py
        # (redact-vectors); the shipped binary has no self-test switch.
        # The CI zip is already sealed. Job env also sets PYTHONDONTWRITEBYTECODE.
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess, os, tempfile, pathlib
          mcp = pathlib.Path("AgentReins.app/Contents/MacOS/AgentReinsMCP").resolve()
          env = os.environ.copy()
          proc = subprocess.Popen(
              [str(mcp)],
              stdin=subprocess.PIPE, stdout=subprocess.PIPE, stderr=subprocess.PIPE,
              text=True, env=env,
          )
          assert proc.stdin and proc.stdout
          def send(obj):
              proc.stdin.write(json.dumps(obj, separators=(",", ":")) + "\n")
              proc.stdin.flush()
          def read():
              line = proc.stdout.readline()
              assert line, "MCP produced no stdout"
              return json.loads(line)
          send({"jsonrpc":"2.0","id":1,"method":"initialize","params":{
              "protocolVersion":"2024-11-05",
              "capabilities":{},
              "clientInfo":{"name":"ci-smoke","version":"1.0"}
          }})
          init = read()
          assert "result" in init, init
          send({"jsonrpc":"2.0","method":"notifications/initialized","params":{}})
          send({"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}})
          tools = read()
          names = [t["name"] for t in tools["result"]["tools"]]
          assert "list_alerts" in names and "list_mcp_audit" in names, names
          import time
          t0 = time.time()
          send({"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"get_coverage","arguments":{}}})
          cov = read()["result"]["structuredContent"]
          summary = cov["integritySummary"]
          print("MCP_INTEGRITY", json.dumps(summary, ensure_ascii=False), "seconds=%.2f" % (time.time() - t0))
          print("MCP_INTEGRITY_WARNING", cov["evidenceIntegrity"].get("warning"))
          assert summary["sameUidCanForge"] is True, summary
          # Fresh runner: either the Keychain key works and everything verifies, or the key is honestly unavailable.
          # pending: the Keychain helper has not answered yet. The read must not block on the 15s hang.
          assert summary["status"] in ("ok", "key_unavailable", "pending"), cov["evidenceIntegrity"]
          print("MCP_SMOKE_OK", names)
          proc.terminate()
          PY

      - name: Packaged HTTP MCP smoke
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python3 tools/agentreins-mcp/test_http_transport.py AgentReins.app/Contents/MacOS/AgentReinsMCP

      - name: Live packaged sampler -> Swift MCP list_network
        # Runs Contents/Resources/socket-sampler/socket_sampler.py, which imports
        # Contents/Resources/agentreins-mcp/evidence.py. The artifact zip is already
        # sealed from the signed bundle; do not recreate it after this step.
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python3 tools/socket-sampler/mcp_list_network_live.py AgentReins.app

      - name: Verify artifact zip signature and no bytecode caches
        run: |
          set -euo pipefail
          extract="$(mktemp -d "${RUNNER_TEMP:-/tmp}/agentreins-artifact.XXXXXX")"
          ditto -x -k AgentReins-ci-universal.zip "$extract"
          app="$extract/AgentReins.app"
          test -d "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          caches="$(find "$app" -name '__pycache__' -print)"
          if [[ -n "$caches" ]]; then
            echo "error: artifact zip contains __pycache__:" >&2
            printf '%s\n' "$caches" >&2
            exit 1
          fi
          pycs="$(find "$app" -name '*.pyc' -print)"
          if [[ -n "$pycs" ]]; then
            echo "error: artifact zip contains .pyc files:" >&2
            printf '%s\n' "$pycs" >&2
            exit 1
          fi
          echo "ARTIFACT_CODESIGN_OK=1"
          echo "ARTIFACT_NO_PYCACHE=1"

      - name: Upload packaged app
        uses: actions/upload-artifact@v7
        with:
          name: AgentReins-macOS-universal
          path: AgentReins-ci-universal.zip
          if-no-files-found: error
          retention-days: 14
