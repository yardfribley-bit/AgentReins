name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and package Universal 2 app
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Show toolchain
        run: swift --version

      - name: Validate packaging script
        run: bash -n package_app.sh

      - name: Run unit tests
        run: swift test

      - name: Run JS risk / XSS tests
        run: |
          set -euo pipefail
          node Tests/Manual/network/test_risk_p5_association.cjs
          node Tests/Manual/network/test_risk_review_store.cjs
          node Tests/Manual/network/test_xss_escape.cjs
          echo "JS_TESTS_PASSED=3"

      - name: Run MCP supervisor unit tests
        run: |
          python3 -m unittest discover -s tools/agentreins-mcp -p 'test_*.py' -v

      - name: Build release app
        env:
          AGENTREINS_ARCHS: universal
          AGENTREINS_VERSION: 0.0.0-ci
          AGENTREINS_BUILD_NUMBER: ${{ github.run_number }}
        run: ./package_app.sh

      - name: Verify architectures, signature, and packaged MCP
        run: |
          lipo -archs AgentReins.app/Contents/MacOS/AgentReins | grep arm64
          lipo -archs AgentReins.app/Contents/MacOS/AgentReins | grep x86_64
          codesign --verify --deep --strict --verbose=2 AgentReins.app
          test -f AgentReins.app/Contents/Resources/agentreins-mcp/server.py
          test -f AgentReins.app/Contents/Resources/agentreins-mcp/evidence.py
          test -f AgentReins.app/Contents/Resources/agentreins-mcp/alerts_bridge.cjs
          test -f AgentReins.app/Contents/Resources/agentreins-mcp/redact_secrets.py
          test -f AgentReins.app/Contents/Resources/RealtimeWorkspace/risk-alerts.js
          test -x AgentReins.app/Contents/MacOS/AgentReinsMCP
          test -x AgentReins.app/Contents/MacOS/AgentReinsAlertsBridge
          lipo -archs AgentReins.app/Contents/MacOS/AgentReinsMCP | grep arm64
          lipo -archs AgentReins.app/Contents/MacOS/AgentReinsAlertsBridge | grep x86_64
          echo "PACKAGED_MCP_OK=1"

      - name: Create CI artifact
        run: ditto -c -k --sequesterRsrc --keepParent AgentReins.app AgentReins-ci-universal.zip

      - name: Upload packaged app
        uses: actions/upload-artifact@v7
        with:
          name: AgentReins-macOS-universal
          path: AgentReins-ci-universal.zip
          if-no-files-found: error
          retention-days: 14
