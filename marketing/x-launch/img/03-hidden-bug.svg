<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#040E1A"/><stop offset="100%" stop-color="#0A1B2C"/>
    </linearGradient>
    <marker id="ar4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3D6B8C"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg4)"/>

  <text x="80" y="82" font-size="42" font-weight="700" fill="#EAF6FF">抓到了，却被界面藏了起来</text>
  <text x="80" y="120" font-size="22" fill="#7FA3BC">实战测试暴露的真缺陷：检测链路在最后一步断掉，用户永远看不到</text>

  <!-- pipeline -->
  <g>
    <text x="80" y="186" font-size="19" font-weight="700" fill="#30D3E5" letter-spacing="1.5">故障链路（修复前）</text>

    <g>
      <rect x="80" y="212" width="260" height="130" rx="12" fill="#0E3A2C" stroke="#39D675" stroke-opacity="0.5"/>
      <text x="108" y="256" font-size="22" font-weight="600" fill="#39D675">① 采集</text>
      <text x="108" y="292" font-size="17" fill="#8FD9AE">tool-intent / lsof-network</text>
      <text x="108" y="318" font-size="17" fill="#8FD9AE">正确捕获外连行为</text>
    </g>

    <g>
      <rect x="380" y="212" width="260" height="130" rx="12" fill="#0E3A2C" stroke="#39D675" stroke-opacity="0.5"/>
      <text x="408" y="256" font-size="22" font-weight="600" fill="#39D675">② 风险评估</text>
      <text x="408" y="292" font-size="17" fill="#8FD9AE">externalContent</text>
      <text x="408" y="318" font-size="17" fill="#8FD9AE">needsAttention = true</text>
    </g>

    <g>
      <rect x="680" y="212" width="260" height="130" rx="12" fill="#3A1213" stroke="#FF5F56" stroke-opacity="0.6"/>
      <text x="708" y="256" font-size="22" font-weight="600" fill="#FF8A80">③ 定级</text>
      <text x="708" y="292" font-size="17" fill="#FFB3AD">severity 被硬编码为</text>
      <text x="708" y="318" font-size="17" fill="#FFB3AD">"info"</text>
    </g>

    <g>
      <rect x="980" y="212" width="260" height="130" rx="12" fill="#3A1213" stroke="#FF5F56" stroke-opacity="0.6"/>
      <text x="1008" y="256" font-size="22" font-weight="600" fill="#FF8A80">④ 界面过滤</text>
      <text x="1008" y="292" font-size="17" fill="#FFB3AD">过滤掉所有</text>
      <text x="1008" y="318" font-size="17" fill="#FFB3AD">severity == "info"</text>
    </g>

    <g>
      <rect x="1280" y="212" width="240" height="130" rx="12" fill="#1A1016" stroke="#FF5F56" stroke-opacity="0.8" stroke-width="2"/>
      <text x="1308" y="256" font-size="22" font-weight="600" fill="#FF5F56">⑤ 结果</text>
      <text x="1308" y="292" font-size="17" fill="#FFB3AD">高危外连事件</text>
      <text x="1308" y="318" font-size="17" fill="#FFB3AD">用户完全看不见</text>
    </g>

    <g stroke="#3D6B8C" stroke-width="2" fill="none" marker-end="url(#ar4)">
      <line x1="346" y1="277" x2="374" y2="277"/>
      <line x1="646" y1="277" x2="674" y2="277"/>
      <line x1="946" y1="277" x2="974" y2="277"/>
      <line x1="1246" y1="277" x2="1274" y2="277"/>
    </g>
  </g>

  <!-- the three root causes -->
  <text x="80" y="410" font-size="19" font-weight="700" fill="#FFB12D" letter-spacing="1.5">三处叠加的断链</text>

  <g>
    <rect x="80" y="436" width="470" height="112" rx="10" fill="#0A2036" stroke="#1B4260"/>
    <text x="108" y="474" font-size="20" font-weight="600" fill="#EAF6FF">1 · 网络类事件从不弹通知</text>
    <text x="108" y="506" font-size="17" fill="#7FA3BC">系统通知只有文件 / 进程 / 记忆三个引擎会触发</text>
    <text x="108" y="530" font-size="17" fill="#7FA3BC">外连行为再危险也不会有横幅</text>

    <rect x="580" y="436" width="470" height="112" rx="10" fill="#0A2036" stroke="#1B4260"/>
    <text x="608" y="474" font-size="20" font-weight="600" fill="#EAF6FF">2 · severity 硬编码 "info"</text>
    <text x="608" y="506" font-size="17" fill="#7FA3BC">危险的外连与常规记录被同等对待</text>
    <text x="608" y="530" font-size="17" fill="#7FA3BC">风险评估结论在最后一步被丢弃</text>

    <rect x="1080" y="436" width="440" height="112" rx="10" fill="#0A2036" stroke="#1B4260"/>
    <text x="1108" y="474" font-size="20" font-weight="600" fill="#EAF6FF">3 · 仪表盘过滤 info 级</text>
    <text x="1108" y="506" font-size="17" fill="#7FA3BC">恰好在靶场域名上断掉</text>
    <text x="1108" y="530" font-size="17" fill="#7FA3BC">标题文案都写好了，只是没人看得到</text>
  </g>

  <!-- fix -->
  <text x="80" y="612" font-size="19" font-weight="700" fill="#39D675" letter-spacing="1.5">修复后（两处代码改动）</text>

  <g>
    <rect x="80" y="638" width="700" height="150" rx="12" fill="#0E3A2C" stroke="#39D675" stroke-opacity="0.5"/>
    <text x="112" y="682" font-size="21" font-weight="600" fill="#8FD9AE">按目的地分级，不再一刀切 info</text>
    <g font-size="17" fill="#B7EBCA">
      <text x="112" y="716">不可信外部内容 / 未知 IP / 模型中转 → high</text>
      <text x="112" y="742">开发者服务（GitHub 等）→ medium</text>
      <text x="112" y="768">已知模型商 / 遥测 → info</text>
    </g>

    <rect x="820" y="638" width="700" height="150" rx="12" fill="#0E3A2C" stroke="#39D675" stroke-opacity="0.5"/>
    <text x="852" y="682" font-size="21" font-weight="600" fill="#8FD9AE">高危外连触发系统通知</text>
    <g font-size="17" fill="#B7EBCA">
      <text x="852" y="716">首次观察到即发送，按事件 ID 去重防轰炸</text>
      <text x="852" y="742">通知标题直接给出域名与判管理由</text>
      <text x="852" y="768">“Untrusted website accessed · …”</text>
    </g>
  </g>

  <text x="80" y="852" font-size="20" fill="#4E7893">安全产品最怕的不是漏检，而是“抓到了却看不见”——这条缺陷只有真跑一次实战才会暴露</text>
</svg>
