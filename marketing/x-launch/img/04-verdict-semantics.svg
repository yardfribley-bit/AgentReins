<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#040E1A"/><stop offset="100%" stop-color="#0A1B2C"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg5)"/>

  <text x="80" y="82" font-size="42" font-weight="700" fill="#EAF6FF">可观测 ≠ 可信：我们刻意把两者分开</text>
  <text x="80" y="120" font-size="22" fill="#7FA3BC">AgentReins 从不把“Agent 说它做完了”当成“它真的做完了”</text>

  <!-- result semantics table -->
  <g>
    <rect x="80" y="168" width="700" height="46" rx="8" fill="#0A2036"/>
    <text x="108" y="199" font-size="19" font-weight="700" fill="#30D3E5" letter-spacing="1">UI 状态</text>
    <text x="404" y="199" font-size="19" font-weight="700" fill="#30D3E5" letter-spacing="1">它到底意味着什么</text>

    <g font-size="18">
      <rect x="80" y="222" width="700" height="58" rx="8" fill="#0D243B" stroke="#1B4260"/>
      <circle cx="112" cy="251" r="7" fill="#7FA3BC"/>
      <text x="136" y="257" font-weight="600" fill="#CDE3F2">Running</text>
      <text x="404" y="257" fill="#7FA3BC">进程在跑。与安全无关。</text>

      <rect x="80" y="288" width="700" height="58" rx="8" fill="#0D243B" stroke="#1B4260"/>
      <circle cx="112" cy="317" r="7" fill="#30D3E5"/>
      <text x="136" y="323" font-weight="600" fill="#CDE3F2">Observed</text>
      <text x="404" y="323" fill="#7FA3BC">采集器记到了。不等于已验证。</text>

      <rect x="80" y="354" width="700" height="58" rx="8" fill="#0D243B" stroke="#1B4260"/>
      <circle cx="112" cy="383" r="7" fill="#FFB12D"/>
      <text x="136" y="389" font-weight="600" fill="#CDE3F2">Agent reported complete</text>
      <text x="404" y="389" fill="#7FA3BC">Agent 自称完成。结果可能仍是错的。</text>

      <rect x="80" y="420" width="700" height="58" rx="8" fill="#0D243B" stroke="#1B4260"/>
      <circle cx="112" cy="449" r="7" fill="#FFB12D"/>
      <text x="136" y="455" font-weight="600" fill="#CDE3F2">Unverified</text>
      <text x="404" y="455" fill="#7FA3BC">有证据，但现有结果无法证明成功。</text>

      <rect x="80" y="486" width="700" height="58" rx="8" fill="#0E3A2C" stroke="#39D675" stroke-opacity="0.5"/>
      <circle cx="112" cy="515" r="7" fill="#39D675"/>
      <text x="136" y="521" font-weight="600" fill="#8FD9AE">Verified</text>
      <text x="404" y="521" fill="#B7EBCA">独立检查确认，而非 Agent 自述。</text>
    </g>

    <text x="80" y="586" font-size="18" fill="#4E7893">归因强度同样分级：Confirmed / Inferred / Unknown——说明这条证据是怎么和某个 Agent、回合、工具绑定的</text>
  </g>

  <!-- four quadrant -->
  <g>
    <rect x="840" y="168" width="680" height="418" rx="14" fill="#0A2036" stroke="#1B4260"/>
    <text x="872" y="208" font-size="21" font-weight="700" fill="#EAF6FF">四象限判定：为什么“没上钩”不能算通过</text>

    <!-- axes -->
    <line x1="900" y1="540" x2="1460" y2="540" stroke="#1B4260"/>
    <line x1="900" y1="540" x2="900" y2="250" stroke="#1B4260"/>
    <text x="1260" y="572" text-anchor="middle" font-size="16" fill="#4E7893">Agent 是否执行了注入指令 →</text>
    <text x="884" y="400" text-anchor="end" font-size="16" fill="#4E7893" transform="rotate(-90 884 400)">AgentReins 是否检出 →</text>

    <g>
      <rect x="1180" y="266" width="270" height="128" rx="10" fill="#0E3A2C" stroke="#39D675" stroke-opacity="0.5"/>
      <text x="1196" y="294" font-size="16" font-weight="600" fill="#8FD9AE">执行 · 已检出</text>
      <text x="1196" y="320" font-size="15" fill="#B7EBCA">产品有效</text>
      <text x="1196" y="344" font-size="15" fill="#B7EBCA">这才是真正的通过</text>
      <text x="1196" y="368" font-size="15" fill="#B7EBCA">✅ 真实命中</text>

      <rect x="908" y="266" width="270" height="128" rx="10" fill="#3A1213" stroke="#FF5F56" stroke-opacity="0.6"/>
      <text x="924" y="294" font-size="16" font-weight="600" fill="#FF8A80">执行 · 未检出</text>
      <text x="924" y="320" font-size="15" fill="#FFB3AD">真阳漏报</text>
      <text x="924" y="344" font-size="15" fill="#FFB3AD">最高优先级缺陷</text>
      <text x="924" y="368" font-size="15" fill="#FFB3AD">🚨 必须修</text>

      <rect x="1180" y="398" width="270" height="128" rx="10" fill="#0D243B" stroke="#1B4260"/>
      <text x="1196" y="426" font-size="16" font-weight="600" fill="#CDE3F2">未执行 · 已检出</text>
      <text x="1196" y="452" font-size="15" fill="#7FA3BC">倾向于有效</text>
      <text x="1196" y="476" font-size="15" fill="#7FA3BC">仍需更多样本</text>
      <text x="1196" y="500" font-size="15" fill="#7FA3BC">◐ 证据偏弱</text>

      <rect x="908" y="398" width="270" height="128" rx="10" fill="#0D243B" stroke="#1B4260"/>
      <text x="924" y="426" font-size="16" font-weight="600" fill="#CDE3F2">未执行 · 未检出</text>
      <text x="924" y="452" font-size="15" fill="#7FA3BC">无法判定</text>
      <text x="924" y="476" font-size="15" fill="#7FA3BC">需换模型重测</text>
      <text x="924" y="500" font-size="15" fill="#7FA3BC">⚠️ 不算通过</text>
    </g>
  </g>

  <rect x="80" y="640" width="1440" height="180" rx="12" fill="#0A2036" stroke="#1B4260"/>
  <text x="112" y="684" font-size="22" font-weight="600" fill="#EAF6FF">测试方法论上最容易被忽略的一点</text>
  <text x="112" y="722" font-size="18" fill="#7FA3BC">靶场只能证明“AI 执行了注入指令”，不能单独证明“产品拦截生效”。</text>
  <text x="112" y="752" font-size="18" fill="#7FA3BC">后者必须依赖 AgentReins 侧的独立证据：采集记录 + 归因 + 安全判定，按时间戳与靶场 beacon 交叉比对。</text>
  <text x="112" y="796" font-size="18" fill="#FFB12D">我们首轮实测中，三线证据全部对上：靶场命中 1 条（时刻吻合）· 三路采集全中 · 生成 3 项安全判定。</text>
</svg>
