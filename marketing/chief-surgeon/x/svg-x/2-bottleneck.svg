<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a1a1aa"/>
    </marker>
  </defs>
  <rect width="1080" height="1350" fill="#ffffff"/>

  <text x="72" y="112" font-size="24" letter-spacing="3" fill="#a1a1aa" font-weight="700">02 · THE BOTTLENECK</text>
  <text x="72" y="204" font-size="46" font-weight="700" fill="#0f172a" letter-spacing="-1">Nobody owns the architecture</text>
  <text x="72" y="262" font-size="30" fill="#71717a">Four competent agents, one shared repo, zero shared model.</text>

  <g fill="#ffffff" stroke="#d4d4d8" stroke-width="2">
    <rect x="72" y="340" width="216" height="104" rx="10"/>
    <rect x="312" y="340" width="216" height="104" rx="10"/>
    <rect x="552" y="340" width="216" height="104" rx="10"/>
    <rect x="792" y="340" width="216" height="104" rx="10"/>
  </g>
  <g font-size="30" font-weight="600" fill="#18181b" text-anchor="middle">
    <text x="180" y="404">Cursor</text>
    <text x="420" y="404">Codex</text>
    <text x="660" y="404">Workbuddy</text>
    <text x="900" y="404">Claude</text>
  </g>

  <!-- crossing arrows into one repo -->
  <g stroke="#a1a1aa" stroke-width="2" marker-end="url(#b)">
    <line x1="180" y1="444" x2="480" y2="600"/>
    <line x1="420" y1="444" x2="520" y2="600"/>
    <line x1="660" y1="444" x2="560" y2="600"/>
    <line x1="900" y1="444" x2="600" y2="600"/>
  </g>

  <rect x="72" y="618" width="936" height="112" rx="10" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="2"/>
  <text x="540" y="686" font-size="34" font-weight="700" fill="#18181b" text-anchor="middle">one repository · no shared model of intent</text>

  <g stroke="#a1a1aa" stroke-width="2" marker-end="url(#b)">
    <line x1="220" y1="730" x2="220" y2="790"/>
    <line x1="540" y1="730" x2="540" y2="790"/>
    <line x1="860" y1="730" x2="860" y2="790"/>
  </g>

  <g fill="#fafafa" stroke="#e4e4e7" stroke-width="2">
    <rect x="72" y="800" width="296" height="100" rx="10"/>
    <rect x="392" y="800" width="296" height="100" rx="10"/>
    <rect x="712" y="800" width="296" height="100" rx="10"/>
  </g>
  <g font-size="28" fill="#3f3f46" text-anchor="middle">
    <text x="220" y="862">context collapse</text>
    <text x="540" y="862">conflicting edits</text>
    <text x="860" y="862">spaghetti code</text>
  </g>

  <rect x="72" y="960" width="5" height="106" fill="#0f766e"/>
  <text x="104" y="1008" font-size="36" font-weight="700" fill="#0f172a">Competence does not compose.</text>
  <text x="104" y="1054" font-size="30" fill="#71717a">More agents amplifies the problem instead of solving it.</text>

  <text x="72" y="1240" font-size="24" fill="#a1a1aa">The failure mode is coordination, not capability.</text>
</svg>
