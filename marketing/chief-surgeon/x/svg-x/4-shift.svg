<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a1a1aa"/>
    </marker>
    <marker id="dt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0f766e"/>
    </marker>
  </defs>
  <rect width="1080" height="1350" fill="#ffffff"/>

  <text x="72" y="100" font-size="24" letter-spacing="3" fill="#a1a1aa" font-weight="700">04 · THE SHIFT</text>
  <text x="72" y="192" font-size="46" font-weight="700" fill="#0f172a" letter-spacing="-1">From monitor plane to control plane</text>

  <!-- control plane -->
  <rect x="72" y="272" width="880" height="208" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
  <text x="104" y="312" font-size="22" letter-spacing="2" fill="#0f766e" font-weight="700">CONTROL PLANE</text>
  <text x="104" y="368" font-size="38" font-weight="700" fill="#0f172a">AgentReins</text>
  <text x="104" y="414" font-size="26" fill="#3f3f46">global repo tree · call graph · intent stream</text>
  <text x="104" y="452" font-size="26" fill="#71717a">refines the spec · issues scoped tasks · holds the gate</text>

  <line x1="512" y1="480" x2="512" y2="536" stroke="#a1a1aa" stroke-width="2" marker-end="url(#d)"/>

  <!-- task envelope -->
  <rect x="72" y="546" width="880" height="140" rx="10" fill="#fafafa" stroke="#d4d4d8" stroke-width="2"/>
  <text x="104" y="586" font-size="22" letter-spacing="2" fill="#a1a1aa" font-weight="700">TASK ENVELOPE</text>
  <g fill="#ffffff" stroke="#d4d4d8" stroke-width="2">
    <rect x="104" y="606" width="264" height="60" rx="8"/>
    <rect x="388" y="606" width="264" height="60" rx="8"/>
    <rect x="672" y="606" width="264" height="60" rx="8"/>
  </g>
  <g font-size="28" fill="#18181b" text-anchor="middle" font-weight="600">
    <text x="236" y="646">scope</text>
    <text x="520" y="646">budget</text>
    <text x="804" y="646">gate</text>
  </g>

  <line x1="512" y1="686" x2="512" y2="742" stroke="#a1a1aa" stroke-width="2" marker-end="url(#d)"/>

  <!-- execution -->
  <rect x="72" y="752" width="880" height="176" rx="10" fill="#ffffff" stroke="#d4d4d8" stroke-width="2"/>
  <text x="104" y="792" font-size="22" letter-spacing="2" fill="#a1a1aa" font-weight="700">EXECUTION LAYER</text>
  <g fill="#fafafa" stroke="#e4e4e7" stroke-width="2">
    <rect x="104" y="812" width="264" height="88" rx="8"/>
    <rect x="388" y="812" width="264" height="88" rx="8"/>
    <rect x="672" y="812" width="264" height="88" rx="8"/>
  </g>
  <g font-size="30" font-weight="600" fill="#18181b" text-anchor="middle">
    <text x="236" y="868">Cursor</text>
    <text x="520" y="868">Codex</text>
    <text x="804" y="868">Workbuddy</text>
  </g>

  <!-- evidence loop -->
  <path d="M 952 840 H 996 V 376 H 952" fill="none" stroke="#0f766e" stroke-width="2"
        stroke-dasharray="8 6" marker-end="url(#dt)"/>
  <text x="1032" y="608" font-size="22" fill="#0f766e" text-anchor="middle" transform="rotate(-90 1032 608)">evidence</text>

  <rect x="72" y="1000" width="5" height="106" fill="#0f766e"/>
  <text x="104" y="1048" font-size="36" font-weight="700" fill="#0f172a">Same telemetry. New authority.</text>
  <text x="104" y="1094" font-size="30" fill="#71717a">The loop closes on evidence, not on vibes.</text>

  <text x="72" y="1240" font-size="24" fill="#a1a1aa">Alpha · macOS · local-first</text>
</svg>
