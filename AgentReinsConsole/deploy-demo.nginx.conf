# Demo front-end only. No enterprise evidence is served by this deployment.
server {
    listen 8080;
    server_name 165.154.254.180;
    root /opt/agentreins-console/public;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control no-store always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'" always;
    location / { try_files $uri $uri/ =404; }
    location /api/ {
        default_type application/json;
        return 503 '{"error":"audit_service_not_configured"}';
    }
    location ~ /\. { deny all; }
}
