server {
    listen 443 ssl;
    server_name 165.154.254.180;
    ssl_certificate /etc/letsencrypt/live/165.154.254.180/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/165.154.254.180/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /opt/agentreins-console/public;
    index index.html;
    add_header Cache-Control no-store always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'" always;
    client_max_body_size 64m;
    location / {
        proxy_pass http://127.0.0.1:8900;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 90s;
        proxy_connect_timeout 5s;
        # Authenticate before accepting potentially large evidence bodies.
        proxy_request_buffering off;
    }
    location ~ /\. { deny all; }
}
