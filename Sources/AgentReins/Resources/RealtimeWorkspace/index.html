<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AgentReins · 实时任务工作台</title><link rel="stylesheet" href="style.css"></head>
<body><div class="shell"><aside class="sidebar"><div class="brand"><span class="brand-icon">A</span>AgentReins</div><div class="workspace-label">实时工作台 <span>本机</span></div><nav aria-label="主导航"><button data-view="process" class="active">◉ <span>任务过程</span></button><button data-view="collection">⌁ <span>采集现场</span></button><button data-view="results">▦ <span>结果看板</span></button></nav><div class="section-label">当前任务 <span id="task-count">0</span></div><select id="agent-filter" class="agent-filter" aria-label="按 Agent 筛选"><option value="all">全部 Agent</option><option value="WorkBuddy">WorkBuddy</option><option value="Codex">Codex</option></select><input id="search" placeholder="查找任务、文件、工具、域名…" aria-label="查找任务、文件、工具、域名"><div id="tasks"></div><div class="sidebar-bottom" id="agent-health"><p>本机独立运行 · 仅实时任务<br>没有任务身份的观察单独保留</p></div></aside><main><header class="topbar"><div><span class="muted">工作台 / </span><span id="view-name">任务过程</span></div><div class="top-actions"><span class="demo" id="live-label">等待采集</span><button id="follow-latest" class="quiet">跟随最新任务</button><button id="pause" class="quiet">暂停画面</button></div></header><section id="heading" class="task-head"></section><div id="workspace-warning" class="warning-bar" hidden></div><section id="process-view"><div id="stages" aria-label="生命周期阶段"></div><div class="process-layout" id="graph-screen"><section class="canvas-panel"><div class="panel-head"><div><h2 id="canvas-title">任务如何推进</h2><p id="canvas-note">点击节点或连线，查看实际内容</p></div><span class="subtle-label">实线：已采任务关系<br>虚线：独立观察</span></div><div id="graph" aria-label="任务生命周期动态图"></div><div id="current-bar"></div><div class="timeline-head"><h3>执行时间线 <span id="stage-caption"></span></h3><span>保留每次调用与返回</span></div><div class="timeline-viewport" id="timeline-viewport"><div id="timeline"></div></div></section><aside class="detail-panel inspector" id="detail" aria-live="polite"></aside></div></section><section id="collection-view" hidden></section><section id="result-screen" hidden></section><footer>AgentReins 独立实时工作台 <span id="footer-state">等待真实采集数据</span></footer></main></div><div id="toast" role="status" hidden></div><script src="flow.js"></script><script src="live.js"></script></body></html>
