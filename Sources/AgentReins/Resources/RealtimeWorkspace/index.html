<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AgentReins · 实时任务工作台</title><link rel="stylesheet" href="style.css"></head>
<body><div class="shell"><aside class="sidebar"><div class="brand"><span class="brand-icon">A</span>AgentReins</div><div class="workspace-label">实时工作台 <span>本机</span></div><nav aria-label="主导航"><button data-view="inbox" class="active">☐ <span>待我处理</span></button><button data-view="process">◉ <span>任务过程</span></button><button data-view="network">↗ <span>外网访问</span></button><button data-view="collection">⌁ <span>采集现场</span></button><button data-view="results">▦ <span>结果看板</span></button></nav><div class="section-label">当前任务 <span id="task-count">0</span></div><select id="agent-filter" class="agent-filter" aria-label="按 Agent 筛选"><option value="all">全部 Agent</option><option value="WorkBuddy">WorkBuddy</option><option value="Codex">Codex</option><option value="Cursor">Cursor</option></select><input id="search" placeholder="查找任务、文件、工具、域名…" aria-label="查找任务、文件、工具、域名"><div id="tasks"></div><div class="sidebar-bottom" id="agent-health"><p>本机独立运行 · 仅实时任务<br>没有任务身份的观察单独保留</p></div></aside><main><header class="topbar"><div><span class="muted">工作台 / </span><span id="view-name">待我处理</span></div><div class="top-actions"><button type="button" class="demo" id="live-label" data-view="collection">等待采集</button><button id="follow-latest" class="quiet">跟随最新任务</button><button id="pause" class="quiet">暂停画面</button></div></header><section id="heading" class="task-head"></section><div id="workspace-warning" class="warning-bar" hidden></div><section id="inbox-view"></section><section id="process-view" hidden><div id="empty-guide" hidden><h2>还没有带任务身份的记录</h2><ol><li>打开采集现场，看审计代理是否在听。</li><li>确认命令入口已经装上，并重新打开 WorkBuddy、Codex、Cursor。</li><li>等一次真实的工具调用出现后，再看任务过程。</li></ol><button type="button" data-view="collection">打开采集现场</button></div><div id="stages" aria-label="生命周期阶段"></div><div class="process-layout" id="graph-screen"><section class="canvas-panel"><div class="architecture-toolbar"><div class="architecture-modes" role="group" aria-label="选择展示方式"><button data-graph-mode="architecture" aria-pressed="true">架构流程</button><button data-graph-mode="spider" aria-pressed="false">蜘蛛关系</button></div><div class="graph-zoom" role="group" aria-label="画布缩放"><button data-zoom="out" aria-label="缩小画布">−</button><output id="graph-scale">适应窗口</output><button data-zoom="in" aria-label="放大画布">＋</button><button data-zoom="readable" aria-pressed="true">清晰阅读</button><button data-zoom="fit" aria-pressed="false">适应全图</button><button data-zoom="actual">100%</button><button data-graph-focus>定位当前</button><button data-action="toggle-details" id="toggle-details">收起详情</button></div></div><div class="panel-head"><div><h2 id="canvas-title">任务如何推进</h2><p id="canvas-note">点击节点或连线，查看实际内容</p></div><span class="subtle-label">实线：已有配对证据<br>虚线：架构路径 / 关系待确认</span></div><div class="runtime-controls" id="runtime-controls"></div><div id="graph-viewport" tabindex="0" aria-label="可缩放任务画布"><div id="graph-nav" aria-label="全图导航"></div><div id="graph-spacer"><div id="graph" aria-label="任务生命周期动态图"></div></div></div><div class="runtime-note" id="runtime-note"></div><div id="current-bar"></div><div class="timeline-head"><div class="timeline-tabs"><button id="timeline-tools" class="active" data-timeline="tools">工具调用</button><button id="timeline-all" data-timeline="all">全部证据</button><span id="stage-caption"></span></div><span>点击查看过程与返回</span></div><div class="timeline-viewport" id="timeline-viewport"><div id="timeline"></div></div></section><aside class="detail-panel inspector" id="detail" aria-live="polite"></aside></div></section><section id="collection-view" hidden></section><section id="network-view" hidden></section><section id="result-screen" hidden></section><footer>AgentReins 独立实时工作台 <span id="footer-state">等待真实采集数据</span></footer></main></div><div id="toast" role="status" hidden></div><script src="runtime-graph.js"></script><script src="spider-graph.js"></script><script src="flow.js"></script><script src="network-view.js"></script><script src="live.js"></script><script src="transport-view.js"></script></body></html>
