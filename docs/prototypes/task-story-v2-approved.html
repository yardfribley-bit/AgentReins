<style>
#ar-story-v2{--ar-bg:light-dark(#f4f6f8,#0e1720);--ar-panel:light-dark(#fff,#17232e);--ar-text:light-dark(#172632,#e3edf4);--ar-muted:light-dark(#596a78,#a2b3c1);--ar-line:light-dark(#dce3e8,#31424e);--ar-accent:light-dark(#08796e,#70dccb);--ar-soft:light-dark(#e8f5f1,#193c39);--ar-warn:light-dark(#865513,#e9bc75);color:var(--ar-text);background:var(--ar-bg);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;border-radius:14px;overflow:hidden}
#ar-story-v2 *{box-sizing:border-box}#ar-story-v2 button,#ar-story-v2 input{font:inherit}#ar-story-v2 button{color:inherit;cursor:pointer}#ar-story-v2 .top{display:flex;gap:26px;align-items:center;flex-wrap:wrap;padding:17px 24px;background:var(--ar-panel);border-bottom:1px solid var(--ar-line)}#ar-story-v2 .brand{font-size:19px;font-weight:650;letter-spacing:-.5px}#ar-story-v2 .brand span{color:var(--ar-accent)}#ar-story-v2 .nav{display:flex;gap:6px;flex-wrap:wrap}#ar-story-v2 button{border:1px solid var(--ar-line);border-radius:7px;padding:7px 12px;background:var(--ar-panel)}#ar-story-v2 .nav button{border:0;background:transparent;color:var(--ar-muted)}#ar-story-v2 .nav button[aria-pressed=true]{background:var(--ar-soft);color:var(--ar-accent)}#ar-story-v2 .demo{margin-left:auto;font-size:12px;color:var(--ar-muted)}#ar-story-v2 main{padding:24px}#ar-story-v2 h2{font-size:23px;line-height:1.3;margin:0 0 7px;letter-spacing:-.4px}#ar-story-v2 h3{font-size:16px;margin:0 0 10px}#ar-story-v2 p{margin:6px 0}#ar-story-v2 .muted{color:var(--ar-muted)}#ar-story-v2 .small{font-size:12px}#ar-story-v2 .head{display:flex;gap:16px;justify-content:space-between;align-items:start;margin-bottom:20px;flex-wrap:wrap}#ar-story-v2 .status{color:var(--ar-accent);font-weight:550}#ar-story-v2 .panel{background:var(--ar-panel);border:1px solid var(--ar-line);border-radius:12px;padding:20px}#ar-story-v2 .hero{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:20px;background:var(--ar-soft);border-radius:10px;padding:16px 20px}#ar-story-v2 .hero strong{font-size:17px}#ar-story-v2 .metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:20px 0}#ar-story-v2 .metrics>div{padding-right:12px;border-right:1px solid var(--ar-line)}#ar-story-v2 .metrics>div:last-child{border:0}#ar-story-v2 .metrics strong{display:block;font-size:21px;font-variant-numeric:tabular-nums}#ar-story-v2 .metrics span{font-size:12px;color:var(--ar-muted)}#ar-story-v2 .cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:18px;align-items:start}#ar-story-v2 .steps{position:relative;padding-left:18px}#ar-story-v2 .steps:before{content:"";position:absolute;left:5px;top:18px;bottom:24px;width:1px;background:var(--ar-line)}#ar-story-v2 .step{display:block;position:relative;width:100%;text-align:left;border:1px solid transparent;background:transparent;margin:0 0 7px;padding:11px 13px}#ar-story-v2 .step:before{content:"";position:absolute;left:-17px;top:22px;width:8px;height:8px;border-radius:50%;background:var(--ar-accent)}#ar-story-v2 .step[aria-pressed=true]{background:var(--ar-soft);border-color:var(--ar-line)}#ar-story-v2 .step strong,#ar-story-v2 .step span{display:block}#ar-story-v2 .step strong{font-weight:600;margin:3px 0}#ar-story-v2 .step span{font-size:12px;color:var(--ar-muted)}#ar-story-v2 .step.future{opacity:.5}#ar-story-v2 .step.future:before{background:var(--ar-muted)}#ar-story-v2 .quote{padding:12px 14px;border-left:3px solid var(--ar-accent);background:var(--ar-soft);border-radius:0 7px 7px 0;margin:12px 0}#ar-story-v2 .item{padding:13px 0;border-top:1px solid var(--ar-line)}#ar-story-v2 .item b{font-weight:600}#ar-story-v2 pre{padding:13px;background:var(--ar-bg);border-radius:7px;white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.65 ui-monospace,monospace}#ar-story-v2 code{overflow-wrap:anywhere}#ar-story-v2 details{border-top:1px solid var(--ar-line);margin-top:15px;padding-top:12px}#ar-story-v2 summary{cursor:pointer;color:var(--ar-muted)}#ar-story-v2 .insight{border-left:3px solid var(--ar-warn);padding:8px 12px;margin-top:16px}#ar-story-v2 .insight b{color:var(--ar-warn)}#ar-story-v2 .row{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}#ar-story-v2 .task{display:block;width:100%;text-align:left;padding:18px;background:var(--ar-panel);border:1px solid var(--ar-line);border-radius:10px;margin:10px 0}#ar-story-v2 .primary{background:var(--ar-accent);color:var(--ar-panel);border-color:transparent}#ar-story-v2 .foot{margin-top:18px;padding-top:15px;border-top:1px solid var(--ar-line);font-size:12px;color:var(--ar-muted)}#ar-story-v2 .badge{background:var(--ar-soft);color:var(--ar-accent);border-radius:5px;padding:3px 7px;font-size:12px}#ar-story-v2 .files{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}#ar-story-v2 [hidden]{display:none!important}#ar-story-v2 .compact .step{padding:7px 12px}
@media(max-width:700px){#ar-story-v2 main{padding:16px}#ar-story-v2 .top{padding:14px 16px;gap:12px}#ar-story-v2 .demo{margin-left:0}#ar-story-v2 .cols{grid-template-columns:1fr}#ar-story-v2 .metrics{grid-template-columns:repeat(2,1fr)}#ar-story-v2 .hero{align-items:start;flex-direction:column}#ar-story-v2 .panel{padding:15px}}
</style>
<header class="top"><div class="brand">Agent<span>Reins</span></div><nav class="nav" aria-label="主导航"><button data-page="overview" aria-pressed="true">任务总览</button><button data-page="task" aria-pressed="false">当前任务</button><button data-page="history" aria-pressed="false">历史任务</button></nav><span class="demo">交互原型 v2 · 全部为示例数据</span></header>
<main id="ar-story-content" aria-live="polite"></main>
<script>
(()=>{
const root=document.getElementById('ar-story-v2'),main=root.querySelector('main');
const state={page:'overview',step:4,complete:false,replay:false,more:false,compact:false};
const steps=[
{time:'14:32:00',title:'收到你的任务',desc:'编写 C++ Hello World，并编译运行验证',duration:'任务开始',heading:'这次要完成什么',body:'<div class="quote">在当前项目中创建 hello.cpp，输出 Hello, World!，然后编译运行，确认结果。</div><div class="item"><b>预期交付</b><p>hello.cpp 源代码、可运行程序，以及执行结果。</p></div><div class="item"><b>工作位置</b><p><code>~/Projects/hello-demo</code></p></div>'},
{time:'14:32:01',title:'带着任务、项目背景和记忆请求模型',desc:'第 1 轮 · 附带 C++ 编译偏好和项目位置',duration:'等待 4.2 秒',heading:'这一轮发送了哪些内容',body:'<div class="quote">请求模型生成 C++ 程序，并安排写入、编译和验证步骤。</div><div class="item"><b>你的要求</b><p>创建 hello.cpp，编译并确认输出。</p></div><div class="item"><b>记忆 · 2 条已出现在请求正文中</b><p>你偏好 C++17；希望示例代码保持简洁。</p><details><summary>阅读记忆原文与匹配依据</summary><pre>用户偏好：C++ 示例默认使用 C++17。\n代码风格：优先简洁、可直接运行的示例。\n证据：上述文本在本轮已采集的模型请求中逐字出现。</pre></details></div><div class="item"><b>项目与工具</b><p>项目位置、运行环境，以及写文件和执行命令的工具说明。</p></div><div class="insight"><b>上下文效率</b><p>示例中，早先的天气对话也被带入本轮请求。它与当前编程任务的关系需要核查。</p></div>'},
{time:'14:32:05',title:'模型生成代码，要求写文件并验证',desc:'第 1 轮回复 · 下一步创建 hello.cpp',duration:'响应已收到',heading:'模型告诉 Agent 做什么',body:'<div class="quote">创建一个打印 Hello, World! 的 C++ 程序，然后使用 clang++ 编译并执行。</div><div class="item"><b>模型要求的动作</b><p>1. 将代码写入 hello.cpp。<br>2. 用 C++17 编译。<br>3. 运行程序并检查输出。</p></div><details><summary>阅读完整回复与工具调用要求</summary><pre>write_file(path="hello.cpp", content="…")\nexec(command="clang++ -std=c++17 hello.cpp -o hello &amp;&amp; ./hello")</pre></details><details><summary>可观测推理</summary><p>这个示例没有提供推理正文。</p></details>'},
{time:'14:32:06',title:'已创建 hello.cpp',desc:'写入 6 行代码 · 位于 hello-demo 项目',duration:'用时 0.3 秒',heading:'创建了什么文件',body:'<div class="row"><b>hello.cpp</b><span class="badge">新增 · 6 行</span></div><p class="small muted">~/Projects/hello-demo/hello.cpp</p><pre>#include &lt;iostream&gt;\n\nint main() {\n    std::cout &lt;&lt; "Hello, World!" &lt;&lt; std::endl;\n    return 0;\n}</pre><p>文件写入工具返回成功。编译和运行结果见下一步。</p><details><summary>工具参数与原始结果</summary><pre>工具：write_file\n路径：hello.cpp\n结果：写入成功\n耗时：0.3 秒</pre></details>'},
{time:'14:32:07',title:'正在编译并运行程序',desc:'检查程序能否运行、输出是否正确',duration:'已用时 1.1 秒',heading:'当前在验证什么',body:'<p>执行下面的命令，先编译程序；编译成功后运行。</p><pre>clang++ -std=c++17 hello.cpp -o hello &amp;&amp; ./hello</pre><div class="item"><b>预期输出</b><pre>Hello, World!</pre></div><p class="status">正在等待命令执行结果…</p><p class="small muted">此时尚不能标记“验证通过”。</p>'},
{time:'14:32:10',title:'验证通过，任务完成',desc:'程序输出正确 · Agent 已返回结果',duration:'总耗时 10 秒',heading:'你拿到了什么',body:'<div class="quote">程序已创建、编译并运行，输出与要求一致。</div><div class="files"><span class="badge">hello.cpp · 源代码</span><span class="badge">hello · 可执行程序</span></div><div class="item"><b>运行结果</b><pre>Hello, World!\n退出码：0</pre></div><div class="item"><b>完成依据</b><p>已观察到文件写入成功、命令退出码为 0，以及匹配的程序输出。</p></div><div class="item"><b>第二轮模型交互</b><p>Agent 将运行结果发给模型；模型确认结果并返回最终答复。</p></div>'}
];
function metrics(done){return '<div class="metrics"><div><span>任务耗时</span><strong>'+(done?'10 秒':'8 秒')+'</strong></div><div><span>模型交互</span><strong>'+(done?'2 轮':'1 轮')+'</strong></div><div><span>Token 消耗</span><strong>'+(done?'4,620':'3,240')+'</strong></div><div><span>文件变更</span><strong>1 个</strong></div></div>'}
function save(){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{prototype:'task-story-v2',page:state.page,selectedStep:steps[state.step].title,complete:state.complete},privateContent:{...state}}).catch(()=>{})}
function overview(){return '<div class="head"><div><h2>正在发生什么</h2><p class="muted">本次采集从 14:30 开始 · 只显示此后发生的任务</p></div><span class="status">● 正在采集</span></div><div class="panel"><div class="row"><h3>'+(state.complete?'本次已完成 · 1 项':'正在执行 · 1 项')+'</h3><span class="small muted">WorkBuddy</span></div><button class="task" data-open="live"><div class="row"><strong>编写并验证 Hello World C++ 程序</strong><span class="badge">'+(state.complete?'已完成':'验证中')+'</span></div><p>'+(state.complete?'程序输出正确，源代码和运行结果已就绪。':'代码已写好，正在编译运行，检查输出是否正确。')+'</p><p class="small muted">'+(state.complete?'10 秒 · 2 轮模型交互 · 4,620 Token':'8 秒 · 1 轮模型交互 · 3,240 Token')+' · 1 个文件</p></button><div class="insight"><b>1 项效率线索</b><p>请求包含早先的天气对话，可检查这些内容是否需要继续随任务发送。</p><button data-insight="context">查看这轮上下文</button></div></div><p class="foot">启动前的任务在「历史任务」按页查询。</p>'}
function task(){const done=state.complete||state.replay;const s=steps[state.step];let body=s.body;if(state.step===4&&done)body='<p>编译和运行均已结束。</p><pre>clang++ -std=c++17 hello.cpp -o hello &amp;&amp; ./hello</pre><div class="item"><b>实际输出</b><pre>Hello, World!\n退出码：0</pre></div><p class="status">验证通过 · 用时 1.6 秒</p>';return '<div class="head"><div><p class="small muted">WorkBuddy · '+(state.replay?'历史任务 · 昨日 14:32':'当前任务 · 14:32 开始')+'</p><h2>编写并验证 Hello World C++ 程序</h2></div><button data-back="1">返回'+(state.replay?'历史任务':'总览')+'</button></div><div class="hero"><div><strong>'+(state.replay?'回放定位：'+s.title:done?'任务已完成，程序运行结果正确':'正在验证程序 · 代码已写好')+'</strong><p class="small muted">'+(done?'已交付 hello.cpp，编译及输出验证通过。':'当前等待编译与运行结果，无需你介入。')+'</p></div>'+(!done?'<button class="primary" data-finish="1">模拟收到完成事件</button>':'<span class="badge">已完成</span>')+'</div>'+metrics(done)+'<div class="cols"><section class="panel"><h3>'+(state.replay?'按步骤回看':'任务执行过程')+'</h3><div class="steps">'+steps.map((x,i)=>'<button class="step '+(!done&&i===5?'future':'')+'" data-step="'+i+'" aria-pressed="'+(state.step===i)+'" '+(!done&&i===5?'disabled':'')+'><span>'+x.time+' · '+(i===4&&done?'用时 1.6 秒':x.duration)+'</span><strong>'+(i===4&&done?'已编译运行，输出正确':x.title)+'</strong><span>'+x.desc+'</span></button>').join('')+'</div></section><section class="panel"><p class="small muted">步骤 '+(state.step+1)+' / 6</p><h3>'+s.heading+'</h3>'+body+'<details><summary>采集来源与原始 JSON</summary><pre>'+JSON.stringify({example:true,step:state.step+1,source:'WorkBuddy 示例记录',note:'这里展示所选步骤对应的证据；实际产品保留原始数据。'},null,2)+'</pre></details></section></div><div class="foot row"><span>任务外联：模型服务 2 次 · 外部资源 0 次 · SSH 0 次 · MCP 0 次</span><button data-network="1">查看外联明细</button></div>'}
function history(){return '<div class="head"><div><h2>历史任务</h2><p class="muted">按需读取任务摘要，打开某项后加载它的执行过程。</p></div><span class="small muted">第 1 页 · 示例仅列 2 项</span></div><div class="panel"><button class="task" data-open="history"><div class="row"><strong>编写并验证 Hello World C++ 程序</strong><span class="badge">已完成</span></div><p class="muted">WorkBuddy · 昨日 14:32 · 10 秒 · 修改 1 个文件</p><p class="small">编译通过，输出 Hello, World!。</p></button><button class="task" data-history-note="1"><div class="row"><strong>查询上海天气</strong><span class="badge">已完成</span></div><p class="muted">WorkBuddy · 昨日 09:15 · 6 秒 · 无文件变更</p><p class="small">重复查询线索：5 分钟前执行过相同请求。</p></button>'+(state.more?'<p class="muted">示例已到底。正式产品每次从数据库继续读取 20 项摘要。</p>':'<button data-more="1">加载更早的 20 项</button>')+'</div>'}
function render(){root.classList.toggle('compact',state.compact);root.querySelectorAll('[data-page]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.page===(state.replay?'history':state.page))));main.innerHTML=state.page==='overview'?overview():state.page==='history'?history():task()}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page){state.page=b.dataset.page;state.replay=false}else if(b.dataset.open){state.page='task';state.replay=b.dataset.open==='history';state.step=state.replay?0:state.complete?5:4}else if(b.dataset.step){state.step=Number(b.dataset.step)}else if(b.dataset.finish){state.complete=true;state.step=5}else if(b.dataset.back){state.page=state.replay?'history':'overview';state.replay=false}else if(b.dataset.insight){state.page='task';state.replay=false;state.step=1}else if(b.dataset.more){state.more=true}else if(b.dataset.network){const section=document.createElement('div');section.className='item';section.textContent='示例外联：两轮请求发往配置的模型服务，均由 WorkBuddy 发起。此示例未调用 MCP、SSH 或其他外部资源。';b.parentElement.append(section);b.disabled=true;return}else if(b.dataset.historyNote){b.insertAdjacentHTML('beforeend','<p class="small">此项仅示意历史列表摘要；可打开上方 C++ 任务体验完整回放。</p>');b.disabled=true;return}else{return}render();save()});
function restore(value){const v=value?.privateContent;if(v&&['overview','task','history'].includes(v.page)){Object.assign(state,v);state.step=Math.max(0,Math.min(5,Number(v.step)||0))}render()}
restore(window.openai?.widgetState);window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState)restore(e.detail.globals.widgetState)});
if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:render});tweak.addToggle(state,'compact',{label:'紧凑执行链'});}
})();
</script>
</div>
