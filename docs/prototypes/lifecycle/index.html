<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AgentReins · 生命周期原型</title><link rel="stylesheet" href="style.css"></head>
<body><div class="shell"><aside class="sidebar"><div class="brand"><span class="brand-icon">A</span>AgentReins</div><div class="workspace-label">实时工作台 <span>本机</span></div><nav aria-label="主导航"><button data-view="process">◉ <span>任务过程</span></button><button data-view="collection">⌁ <span>采集现场</span></button><button data-view="results">▦ <span>结果看板</span></button></nav><div class="section-label">当前任务 <span id="task-count">4</span></div><input id="search" placeholder="查找任务、文件、工具…" aria-label="查找任务"><div id="tasks"></div><div class="sidebar-bottom"><div>● WorkBuddy <span>已连接</span></div><div>● Codex <span>已连接</span></div><p>设计原型 · 全部为演示数据<br>不代表当前真实采集状态</p></div></aside><main><header class="topbar"><div><span class="muted">工作台 / </span><span id="view-name">任务过程</span></div><div class="top-actions"><span class="demo">交互原型 · 演示数据</span><button id="pause" class="quiet">暂停画面</button><button id="advance" class="primary">演示下一步 →</button></div></header><section id="heading"></section><section id="process-view"><div id="stages" aria-label="生命周期阶段"></div><div class="process-layout"><section class="canvas-panel"><div class="panel-head"><div><h2>任务如何推进</h2><p>点击节点或连线，查看这一环实际发生了什么</p></div><span class="subtle-label">实线：任务关系<br>虚线：独立观察</span></div><div id="graph"></div><div id="current-bar"></div><div class="timeline-head"><h3>执行时间线</h3><span>按轮次组织 · 保留失败与重试</span></div><div id="timeline"></div></section><aside class="detail-panel" id="detail" aria-live="polite"></aside></div></section><section id="collection-view" hidden></section><section id="results-view" hidden></section><footer>AgentReins 独立实时工作台 <span>原型：点击可查看内容；“演示下一步”模拟新事件</span></footer></main></div><div id="toast" role="status" hidden></div><script src="app.js"></script></body></html>
