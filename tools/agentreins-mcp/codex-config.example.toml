# Snippet for ~/.codex/config.toml — prefer packaged AgentReinsMCP binary.
# Full client snippets (Codex / Claude / Cursor / WorkBuddy):
#   tools/agentreins-mcp/client-configs/

[mcp_servers.agentreins]
command = "/Applications/AgentReins.app/Contents/MacOS/AgentReinsMCP"
startup_timeout_sec = 20
tool_timeout_sec = 30
default_tools_approval_mode = "writes"

