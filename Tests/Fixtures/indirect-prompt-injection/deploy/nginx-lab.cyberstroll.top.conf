# AgentReins indirect-prompt-injection field-test range
# Host: lab.cyberstroll.top  ->  38.55.107.226
#
# Serves a controlled adversarial web page used to validate AgentReins'
# ExternalContentSecurity collector. Injection payloads live behind an
# unguessable path token; the public root is an inert notice page, so a
# third-party crawler that stumbles on this host receives nothing.
#
# This vhost coexists with secretwatcher and map.cyberstroll.top. It does not
# alter either of them.

# --------------------------------------------------------------------------- #
# HTTP: ACME challenge, then permanent redirect.
# --------------------------------------------------------------------------- #
server {
    listen 80;
    listen [::]:80;
    server_name lab.cyberstroll.top;

    # Let's Encrypt HTTP-01 challenge (initial issuance and renewal).
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --------------------------------------------------------------------------- #
# HTTPS: reverse proxy to the loopback-bound harness.
# --------------------------------------------------------------------------- #
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name lab.cyberstroll.top;

    ssl_certificate     /etc/letsencrypt/live/lab.cyberstroll.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lab.cyberstroll.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:IpiRangeSSL:10m;
    ssl_session_timeout 1d;

    # Belt and braces: the harness already emits this header, but ensure it on
    # every response, including error pages generated by nginx itself.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    access_log /var/log/nginx/lab.cyberstroll.top.access.log;
    error_log  /var/log/nginx/lab.cyberstroll.top.error.log;

    location / {
        proxy_pass http://127.0.0.1:8790;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # The beacon log must reflect real requests, never a cached response.
        proxy_buffering off;
        proxy_cache off;
        proxy_http_version 1.1;
    }
}
